name: Regenerate results

# Full-size Monte-Carlo runs of all model experiments (about 10 minutes).
# Produces results/*.json and docs/figures/*.png as an artifact; review and commit them manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: make results PY=python
      - uses: actions/upload-artifact@v7
        with:
          name: results-and-figures
          path: |
            results/*.json
            docs/figures/*.png
