name: Python models

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: py-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python models (lint + unit tests + smoke run)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests experiments
      - name: Unit tests
        run: pytest
      - name: Experiment smoke run (OFDM_QUICK=1)
        run: make quick PY=python
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: quick-figures
          path: build/figures-quick/
